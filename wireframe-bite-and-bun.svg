<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1580" viewBox="0 0 1400 1580" font-family="Arial, sans-serif">
  <style>
    .bg{fill:#f4f4f5}
    .frame{fill:#ffffff;stroke:#c8c8cc;stroke-width:2}
    .box{fill:#e4e4e7;stroke:#b4b4ba;stroke-width:1.5}
    .box2{fill:#eeeef0;stroke:#c8c8cc;stroke-width:1.5}
    .btn{fill:#9a9aa2;stroke:none}
    .btnO{fill:none;stroke:#9a9aa2;stroke-width:2}
    .img{fill:#d4d4d8;stroke:#b4b4ba;stroke-width:1.5}
    .line{stroke:#b8b8be;stroke-width:6;stroke-linecap:round}
    .lineS{stroke:#c4c4ca;stroke-width:4;stroke-linecap:round}
    .t{fill:#3f3f46;font-size:13px}
    .tb{fill:#27272a;font-size:15px;font-weight:bold}
    .tw{fill:#ffffff;font-size:12px;font-weight:bold}
    .cap{fill:#71717a;font-size:12px}
    .title{fill:#18181b;font-size:22px;font-weight:bold}
    .diag{stroke:#c4c4ca;stroke-width:1.5}
  </style>

  <rect width="1400" height="1580" class="bg"/>
  <text x="40" y="45" class="title">WIREFRAME — BITE &amp; BUN</text>
  <text x="40" y="68" class="cap">Khung xương low-fidelity · Desktop + Mobile + Overlay</text>

  <!-- ============ DESKTOP HOMEPAGE ============ -->
  <text x="40" y="105" class="tb">1 · TRANG CHỦ (Desktop)</text>
  <rect x="40" y="120" width="820" height="1000" rx="6" class="frame"/>

  <!-- Nav -->
  <rect x="40" y="120" width="820" height="56" rx="6" class="box"/>
  <circle cx="80" cy="148" r="16" class="btn"/>
  <text x="105" y="153" class="t">Logo</text>
  <line x1="300" y1="148" x2="360" y2="148" class="lineS"/>
  <line x1="380" y1="148" x2="440" y2="148" class="lineS"/>
  <line x1="460" y1="148" x2="520" y2="148" class="lineS"/>
  <rect x="600" y="134" width="120" height="28" rx="14" class="box2"/>
  <text x="612" y="152" class="cap">Giao/Đến lấy</text>
  <circle cx="770" cy="148" r="13" class="btnO"/>
  <circle cx="810" cy="148" r="13" class="btnO"/>

  <!-- Hero -->
  <rect x="56" y="192" width="788" height="230" rx="6" class="img"/>
  <line x1="90" y1="250" x2="430" y2="250" class="line"/>
  <line x1="90" y1="285" x2="360" y2="285" class="line"/>
  <line x1="90" y1="320" x2="500" y2="320" class="lineS"/>
  <rect x="90" y="345" width="380" height="44" rx="8" class="box2"/>
  <text x="105" y="372" class="cap">[Giao hàng | Đến lấy]  + ô địa chỉ</text>
  <rect x="490" y="345" width="150" height="44" rx="8" class="btn"/>
  <text x="518" y="372" class="tw">ĐẶT MÓN</text>

  <!-- Promo strip -->
  <rect x="56" y="438" width="788" height="70" rx="6" class="box"/>
  <text x="72" y="465" class="tb">Khuyến mãi</text>
  <line x1="72" y1="482" x2="300" y2="482" class="lineS"/>
  <rect x="700" y="458" width="120" height="30" rx="15" class="btnO"/>

  <!-- Best sellers -->
  <text x="56" y="540" class="tb">Món bán chạy</text>
  <g>
    <rect x="56" y="552" width="180" height="200" rx="6" class="box2"/>
    <rect x="66" y="562" width="160" height="100" rx="4" class="img"/>
    <line x1="66" y1="682" x2="200" y2="682" class="lineS"/>
    <line x1="66" y1="702" x2="150" y2="702" class="lineS"/>
    <text x="66" y="735" class="t">đ</text><rect x="160" y="720" width="66" height="22" rx="11" class="btn"/>
  </g>
  <use href="#card" x="200"/>
  <g transform="translate(200,0)"><rect x="56" y="552" width="180" height="200" rx="6" class="box2"/><rect x="66" y="562" width="160" height="100" rx="4" class="img"/><line x1="66" y1="682" x2="200" y2="682" class="lineS"/><line x1="66" y1="702" x2="150" y2="702" class="lineS"/><rect x="160" y="720" width="66" height="22" rx="11" class="btn"/></g>
  <g transform="translate(400,0)"><rect x="56" y="552" width="180" height="200" rx="6" class="box2"/><rect x="66" y="562" width="160" height="100" rx="4" class="img"/><line x1="66" y1="682" x2="200" y2="682" class="lineS"/><line x1="66" y1="702" x2="150" y2="702" class="lineS"/><rect x="160" y="720" width="66" height="22" rx="11" class="btn"/></g>
  <g transform="translate(600,0)"><rect x="56" y="552" width="180" height="200" rx="6" class="box2"/><rect x="66" y="562" width="160" height="100" rx="4" class="img"/><line x1="66" y1="682" x2="200" y2="682" class="lineS"/><line x1="66" y1="702" x2="150" y2="702" class="lineS"/><rect x="160" y="720" width="66" height="22" rx="11" class="btn"/></g>

  <!-- Categories -->
  <text x="56" y="792" class="tb">Tìm theo loại</text>
  <rect x="56" y="804" width="140" height="44" rx="22" class="box2"/>
  <rect x="210" y="804" width="140" height="44" rx="22" class="box2"/>
  <rect x="364" y="804" width="140" height="44" rx="22" class="box2"/>
  <rect x="518" y="804" width="140" height="44" rx="22" class="box2"/>
  <rect x="672" y="804" width="140" height="44" rx="22" class="box2"/>

  <!-- Reservation / app -->
  <rect x="56" y="868" width="384" height="140" rx="6" class="box"/>
  <text x="72" y="895" class="tb">Đặt bàn</text>
  <rect x="72" y="910" width="160" height="30" rx="6" class="box2"/>
  <rect x="72" y="950" width="160" height="30" rx="6" class="box2"/>
  <rect x="248" y="910" width="160" height="30" rx="6" class="box2"/>
  <rect x="248" y="950" width="120" height="34" rx="8" class="btn"/>
  <rect x="460" y="868" width="384" height="140" rx="6" class="img"/>
  <text x="476" y="895" class="cap">Tải app / Blog</text>

  <!-- Footer -->
  <rect x="40" y="1024" width="820" height="96" rx="6" class="box"/>
  <text x="60" y="1052" class="cap">Footer — liên kết · liên hệ · mạng xã hội</text>
  <line x1="60" y1="1072" x2="220" y2="1072" class="lineS"/>
  <line x1="260" y1="1072" x2="420" y2="1072" class="lineS"/>
  <line x1="460" y1="1072" x2="620" y2="1072" class="lineS"/>

  <!-- ============ MOBILE ============ -->
  <text x="900" y="105" class="tb">2 · TRANG CHỦ (Mobile)</text>
  <rect x="900" y="120" width="240" height="500" rx="14" class="frame"/>
  <rect x="900" y="120" width="240" height="44" rx="14" class="box"/>
  <circle cx="922" cy="142" r="11" class="btn"/>
  <rect x="1092" y="130" width="34" height="24" rx="6" class="box2"/>
  <text x="1100" y="147" class="cap">☰</text>
  <rect x="912" y="176" width="216" height="110" rx="6" class="img"/>
  <rect x="912" y="238" width="140" height="30" rx="6" class="box2"/>
  <rect x="912" y="298" width="216" height="40" rx="6" class="box2"/>
  <text x="924" y="323" class="cap">[Giao | Đến lấy]</text>
  <rect x="912" y="350" width="216" height="60" rx="6" class="box"/>
  <text x="924" y="374" class="cap">Khuyến mãi</text>
  <rect x="912" y="424" width="102" height="120" rx="6" class="box2"/>
  <rect x="920" y="432" width="86" height="60" rx="4" class="img"/>
  <rect x="1026" y="424" width="102" height="120" rx="6" class="box2"/>
  <rect x="1034" y="432" width="86" height="60" rx="4" class="img"/>
  <rect x="912" y="556" width="216" height="48" rx="6" class="box"/>
  <text x="924" y="585" class="cap">Footer</text>

  <!-- ============ OVERLAY: CART ============ -->
  <text x="900" y="668" class="tb">3 · OVERLAY — Giỏ / Thanh toán</text>
  <rect x="900" y="684" width="460" height="436" rx="6" class="bg" stroke="#c8c8cc" stroke-width="2"/>
  <rect x="900" y="684" width="300" height="436" opacity="0.5" fill="#d4d4d8"/>
  <text x="915" y="705" class="cap">(trang chủ mờ phía sau)</text>
  <!-- panel -->
  <rect x="1130" y="684" width="230" height="436" rx="6" class="frame"/>
  <rect x="1130" y="684" width="230" height="44" rx="6" class="box"/>
  <text x="1146" y="712" class="tb">Giỏ hàng</text>
  <text x="1332" y="712" class="tb">✕</text>
  <g transform="translate(0,0)">
    <rect x="1144" y="742" width="202" height="56" rx="6" class="box2"/>
    <rect x="1152" y="750" width="40" height="40" rx="4" class="img"/>
    <line x1="1204" y1="762" x2="1320" y2="762" class="lineS"/>
    <line x1="1204" y1="782" x2="1270" y2="782" class="lineS"/>
  </g>
  <g transform="translate(0,64)">
    <rect x="1144" y="742" width="202" height="56" rx="6" class="box2"/>
    <rect x="1152" y="750" width="40" height="40" rx="4" class="img"/>
    <line x1="1204" y1="762" x2="1320" y2="762" class="lineS"/>
    <line x1="1204" y1="782" x2="1270" y2="782" class="lineS"/>
  </g>
  <line x1="1144" y1="884" x2="1346" y2="884" class="diag"/>
  <text x="1144" y="912" class="cap">Tạm tính</text><text x="1300" y="912" class="cap">đ</text>
  <text x="1144" y="938" class="cap">Ưu đãi / ship</text><text x="1300" y="938" class="cap">đ</text>
  <text x="1144" y="972" class="tb">Tổng</text><text x="1300" y="972" class="tb">đ</text>
  <rect x="1144" y="990" width="202" height="46" rx="8" class="btn"/>
  <text x="1200" y="1018" class="tw">THANH TOÁN</text>
  <rect x="1144" y="1048" width="202" height="56" rx="6" class="box2"/>
  <text x="1156" y="1072" class="cap">Voucher · OTP · Giao/Đến lấy</text>
  <text x="1156" y="1092" class="cap">(bước tiếp theo)</text>

  <!-- Legend -->
  <text x="40" y="1170" class="tb">CHÚ THÍCH</text>
  <rect x="40" y="1184" width="30" height="20" class="img"/><text x="80" y="1199" class="t">Ảnh / hình minh hoạ</text>
  <rect x="240" y="1184" width="30" height="20" class="box2"/><text x="280" y="1199" class="t">Ô nhập / thẻ nội dung</text>
  <rect x="470" y="1184" width="30" height="20" class="btn"/><text x="510" y="1199" class="t">Nút hành động chính</text>
  <line x1="700" y1="1194" x2="760" y2="1194" class="line"/><text x="775" y="1199" class="t">Dòng chữ (placeholder)</text>

  <text x="40" y="1250" class="cap">Ghi chú: wireframe chỉ thể hiện BỐ CỤC &amp; PHÂN CẤP — chưa có màu/hình thật.</text>
  <text x="40" y="1272" class="cap">Bước tiếp theo: Wireframe → Mockup (thêm màu/font/ảnh) → Prototype (bấm được).</text>
</svg>
